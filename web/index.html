<!DOCTYPE html>































<html lang="zh-CN">































<head>































<meta charset="utf-8">































<meta name="viewport" content="width=device-width,initial-scale=1">































<title>AgentForge · 智能体开发管理平台</title>
<link rel="icon" type="image/svg+xml" href="/favicon.ico">































<style>































:root{































  --bg:#0e1512; --panel:#141d19; --panel2:#182420; --line:#24332c;































  --text:#dfeae4; --dim:#8ca79b; --green:#22c55e; --green2:#16a34a;































  --amber:#f59e0b; --red:#ef4444; --blue:#38bdf8;































}































*{box-sizing:border-box}































body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}































button{background:var(--green2);color:#fff;border:0;padding:7px 14px;border-radius:6px;cursor:pointer;font-size:13px}































button:hover{background:var(--green)}































button.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}































button.ghost:hover{border-color:var(--green);color:var(--green)}































button.sm{padding:4px 9px;font-size:12px}































button.danger{background:transparent;border:1px solid var(--red);color:var(--red)}































button.danger:hover{background:var(--red);color:#fff}































input,select,textarea{background:#0c1310;border:1px solid var(--line);color:var(--text);































  border-radius:6px;padding:8px 10px;width:100%;font:13px inherit;outline:none}































input:focus,textarea:focus,select:focus{border-color:var(--green)}































textarea{min-height:80px;resize:vertical;font-family:inherit}































label{display:block;margin:0 0 5px;color:var(--dim);font-size:12px}































header{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--panel);































  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}































.logo{font-size:17px;font-weight:700;color:var(--green);letter-spacing:.5px}































.tabs{display:flex;gap:4px;margin-left:8px}































.tab{padding:7px 14px;border-radius:6px;cursor:pointer;color:var(--dim);font-size:13px;border:1px solid transparent}































.tab:hover{color:var(--text)}































.tab.on{background:var(--panel2);color:var(--green);border-color:var(--line)}































.spacer{flex:1}































.badge{padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600}































.b-live{background:rgba(34,197,94,.16);color:var(--green)}































.b-mock{background:rgba(245,158,11,.16);color:var(--amber)}































.b-draft{background:rgba(245,158,11,.14);color:var(--amber)}































.b-pub{background:rgba(34,197,94,.14);color:var(--green)}































.b-arch{background:rgba(140,167,155,.14);color:var(--dim)}































.b-src{background:rgba(56,189,248,.14);color:var(--blue);font-weight:400}































.wrap{max-width:1500px;margin:0 auto;padding:18px 20px 60px}































.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}































.grid{display:grid;gap:12px}































.g4{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}































.g2{grid-template-columns:1fr 1fr}































.agent-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;































  cursor:pointer;transition:.15s}































.agent-card:hover{border-color:var(--green);transform:translateY(-2px)}































.ac-top{display:flex;gap:10px;align-items:center;margin-bottom:8px}































.ac-icon{font-size:26px}































.ac-name{font-weight:600;font-size:15px}































.ac-desc{color:var(--dim);font-size:12px;min-height:36px;margin-bottom:10px}































.ac-meta{display:flex;gap:6px;flex-wrap:wrap;font-size:11px}































.row{display:flex;gap:10px;align-items:center}































.small{font-size:12px;color:var(--dim)}































.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}































pre{background:#0a110e;border:1px solid var(--line);border-radius:8px;padding:12px;































  overflow:auto;max-height:420px;white-space:pre-wrap;word-break:break-word;font-size:12.5px}































.bar{height:6px;background:#0a110e;border-radius:3px;overflow:hidden;margin:6px 0}































.bar>i{display:block;height:100%;background:var(--green);transition:width .4s}































.list-item{padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;cursor:pointer;background:var(--panel2)}































.list-item:hover{border-color:var(--green)}































.list-item.on{border-color:var(--green);background:rgba(34,197,94,.07)}































.chk{display:flex;gap:8px;align-items:flex-start;padding:7px 9px;border:1px solid var(--line);































  border-radius:7px;margin-bottom:5px;cursor:pointer;background:var(--panel2)}































.chk.on{border-color:var(--green);background:rgba(34,197,94,.07)}































.chk input{margin-top:3px;width:auto}































.mask{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;































  justify-content:center;z-index:60;padding:24px}































.mask.on{display:flex}































.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;































  width:min(980px,100%);max-height:88vh;overflow:auto}































.modal h3{margin:0 0 14px;font-size:16px}































.flex{display:flex;gap:12px}































.col{flex:1;min-width:0}































.kv{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--line);font-size:12.5px}































.rt{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:7px;cursor:pointer;background:var(--panel2)}































.rt.on{border-color:var(--green);background:rgba(34,197,94,.08)}































.rt b{font-size:13px}































.rt div{font-size:11.5px;color:var(--dim);margin-top:3px}































.warn{background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.3);color:var(--amber);































  padding:8px 12px;border-radius:7px;font-size:12.5px;margin-bottom:10px}































.err{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);color:#fca5a5;































  padding:8px 12px;border-radius:7px;font-size:12.5px;margin-bottom:10px}































.ok{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.3);color:#86efac;































  padding:8px 12px;border-radius:7px;font-size:12.5px;margin-bottom:10px}































table{width:100%;border-collapse:collapse;font-size:12.5px}































th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left}































th{color:var(--dim);font-weight:500}































.empty{padding:40px;text-align:center;color:var(--dim)}































.field{margin-bottom:12px}































.chips{display:flex;flex-wrap:wrap;gap:5px}































.chip{padding:2px 8px;border-radius:20px;background:var(--panel2);border:1px solid var(--line);font-size:11px}































.pill{padding:2px 8px;border-radius:5px;font-size:11px;background:var(--panel2);border:1px solid var(--line)}















































/* ==================== 聊天对话框样式 ==================== */















.chat-modal{display:flex;flex-direction:column;width:min(980px,100%);height:85vh;max-height:85vh;















  background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}















.chat-header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);















  background:var(--panel2);flex-shrink:0}















.chat-header .ch-title{font-weight:600;font-size:15px;flex:1}















.chat-header .ch-actions{display:flex;gap:6px}















.chat-body{display:flex;flex:1;min-height:0}















.chat-sidebar{width:200px;border-right:1px solid var(--line);background:var(--bg);















  overflow-y:auto;flex-shrink:0}















.chat-sidebar-h{padding:10px 12px;font-size:11px;color:var(--dim);font-weight:600;















  text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--line)}















.chat-conv-item{padding:10px 12px;cursor:pointer;border-bottom:1px solid var(--line);font-size:12.5px;















  transition:.1s}















.chat-conv-item:hover{background:var(--panel2)}















.chat-conv-item.on{background:rgba(34,197,94,.1);border-left:3px solid var(--green)}















.chat-conv-item .cc-title{font-weight:500;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}















.chat-conv-item .cc-time{color:var(--dim);font-size:11px}















.chat-main{flex:1;display:flex;flex-direction:column;min-width:0}















.chat-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}















.chat-msg{max-width:80%;padding:10px 14px;border-radius:12px;font-size:13.5px;line-height:1.7;















  word-break:break-word;white-space:pre-wrap}















.chat-msg.user{align-self:flex-end;background:var(--green2);color:#fff;border-bottom-right-radius:4px}















.chat-msg.assistant{align-self:flex-start;background:var(--panel2);border:1px solid var(--line);















  border-bottom-left-radius:4px}















.chat-msg .cm-meta{font-size:11px;color:var(--dim);margin-top:4px;display:flex;gap:8px}















.chat-msg.error{border-color:var(--red);background:rgba(239,68,68,.08)}















.chat-input-area{padding:14px 16px;border-top:1px solid var(--line);flex-shrink:0}















.chat-input-wrap{display:flex;gap:8px;align-items:flex-end}















.chat-input{flex:1;background:#0c1310;border:1px solid var(--line);color:var(--text);















  border-radius:10px;padding:10px 14px;font:14px/1.6 inherit;resize:none;min-height:44px;max-height:120px;outline:none}















.chat-input:focus{border-color:var(--green)}















.chat-send{background:var(--green2);color:#fff;border:0;padding:10px 18px;border-radius:10px;















  cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap;flex-shrink:0;height:44px}















.chat-send:hover{background:var(--green)}















.chat-send:disabled{opacity:.5;cursor:not-allowed}















.chat-empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:13px}















.chat-typing{font-size:12px;color:var(--dim);padding:4px 16px 0;display:flex;gap:4px;align-items:center}















.chat-typing span{width:6px;height:6px;background:var(--dim);border-radius:50%;animation:bounce .6s infinite alternate}















.chat-typing span:nth-child(2){animation-delay:.15s}















.chat-typing span:nth-child(3){animation-delay:.3s}















@keyframes bounce{to{transform:translateY(-4px)}}















.ch-avatar{width:34px;height:34px;display:flex;align-items:center;justify-content:center;















  font-size:20px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;flex-shrink:0}















.ch-sub{font-weight:400;color:var(--dim);font-size:12.5px;margin-left:6px}















.chat-conv-empty{padding:18px 14px;font-size:12px;color:var(--dim);line-height:1.6;text-align:center}















.chat-send svg{display:block}















.chat-send{display:flex;align-items:center;justify-content:center;width:44px;padding:0}















.chat-conv-item.on .cc-title{color:var(--green)}















.chat-msg.user{box-shadow:0 1px 2px rgba(0,0,0,.25)}















.chat-msg.assistant{box-shadow:0 1px 2px rgba(0,0,0,.18)}















.chat-messages{background:linear-gradient(180deg,var(--bg),var(--panel))}































































/* ==================== 角色视图区分 ==================== */















.view-switch{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:3px;gap:3px;margin-right:14px}















.view-switch button{border:0;background:transparent;color:var(--dim);padding:6px 14px;border-radius:7px;cursor:pointer;font-size:13px;font-weight:500;display:flex;align-items:center;gap:5px;transition:.12s}















.view-switch button.on{background:var(--accent);color:#0b0f0d;font-weight:600}















.view-switch button:not(.on):hover{color:var(--text)}















body.role-builder{--accent:#22c55e}















body.role-user{--accent:#38bdf8}















body.role-builder header{border-bottom:2px solid rgba(34,197,94,.45)}















body.role-user header{border-bottom:2px solid rgba(56,189,248,.45)}















.tab.builder-only::after{content:'构建';font-size:9px;background:rgba(34,197,94,.18);color:var(--green);padding:1px 5px;border-radius:4px;margin-left:7px;vertical-align:middle;font-weight:500}















.role-banner{display:flex;align-items:center;gap:8px;padding:8px 16px;font-size:12.5px;border-bottom:1px solid var(--line)}















body.role-builder .role-banner{background:rgba(34,197,94,.08);color:var(--green)}















body.role-user .role-banner{background:rgba(56,189,248,.08);color:var(--blue)}















.role-banner b{font-weight:600}















/* ==================== 运行监控（Langfuse 风格） ==================== */















.mon-head{display:flex;align-items:baseline;gap:10px;margin-bottom:14px;flex-wrap:wrap}















.mon-head b{font-size:17px}















.mon-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:16px}















.mon-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}















.mon-card .mc-v{font-size:24px;font-weight:700;color:var(--text)}















.mon-card .mc-u{font-size:12px;color:var(--dim);margin-left:3px;font-weight:400}















.mon-card .mc-l{font-size:12px;color:var(--dim);margin-top:4px}















.mon-2col{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0}















.card-h{font-weight:600;margin-bottom:10px;font-size:14px}















.badge.b-ok{background:rgba(34,197,94,.15);color:#86efac;border:1px solid rgba(34,197,94,.3);padding:1px 7px;border-radius:5px;font-size:11px}















.badge.b-err{background:rgba(239,68,68,.15);color:#fca5a5;border:1px solid rgba(239,68,68,.3);padding:1px 7px;border-radius:5px;font-size:11px}















.mbar{margin-bottom:9px}















.mb-label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px}















.mb-track{height:8px;background:var(--panel2);border-radius:5px;overflow:hidden}















.mb-track i{display:block;height:100%;background:linear-gradient(90deg,var(--green2),var(--green));border-radius:5px}















@media(max-width:760px){.mon-2col{grid-template-columns:1fr}}







































/* ==================== Header 右侧权限隔离 ==================== */







.header-right{display:flex;align-items:center;gap:10px}







.header-right .divider{width:1px;height:18px;background:var(--line);flex-shrink:0}







/* 业务人员视图：隐藏所有创建者专属元素 */







body.role-user #mode,







body.role-user #stats,







body.role-user .builder-only-header{display:none !important}







/* 创建者右侧信息组 */







.builder-info{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim)}







.builder-info .badge{font-size:11px;padding:2px 8px}















/* ==================== 任务中心角色区分 ==================== */







.task-user-hint{background:rgba(56,189,248,.08);border:1px solid rgba(56,189,248,.25);







  border-radius:8px;padding:10px 14px;font-size:12.5px;color:var(--blue);margin-bottom:14px;







  display:flex;align-items:center;gap:8px}







body.role-builder .task-user-hint{display:none}







.task-actions-builder button{display:inline-block}







body.role-user .task-actions-builder{display:none}
















/* ==================== 顶部导航排版重构 v2 ==================== */
header{
  display:flex;flex-direction:column;align-items:stretch;
  gap:0;padding:0;background:var(--panel);
  position:sticky;top:0;z-index:30;
}
header::before{
  content:'';position:absolute;left:0;top:0;height:2px;width:100%;
  background:linear-gradient(90deg,var(--accent) 0%,transparent 55%);
  opacity:.55;pointer-events:none;
}
.hdr-top{
  display:flex;align-items:center;gap:10px;
  height:54px;min-height:54px;padding:0 20px;
  border-bottom:1px solid var(--line);
}
.hdr-top .logo{font-size:17px;font-weight:700;color:var(--green);letter-spacing:.5px;flex:0 0 auto}
.hdr-top .brand-tag{
  font-size:11px;color:var(--dim);letter-spacing:.3px;flex:0 0 auto;
  padding-left:10px;border-left:1px solid var(--line);line-height:1.1;
}
.hdr-nav{
  display:flex;align-items:center;
  min-height:50px;padding:6px 20px;
}
header .view-switch{flex:0 0 auto;margin:0 16px 0 0}
header .view-switch button{flex:0 0 auto}
.hdr-nav .tabs{
  display:flex;align-items:center;gap:4px 4px;margin:0;
  flex:1 1 auto;min-width:0;
  flex-wrap:wrap;row-gap:4px;
}
header .tab{flex:0 0 auto;padding:7px 13px;line-height:1.25}
header .header-right{flex:0 0 auto;margin-left:16px}
header .builder-only-header{display:flex;align-items:center;gap:10px;white-space:nowrap}
header .header-divider{width:1px;height:16px;background:var(--line);flex:0 0 auto;display:inline-block}
header #mode{
  display:inline-block;max-width:280px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;vertical-align:middle;
}
header .builder-info{display:flex;align-items:center;font-size:12px;color:var(--dim);white-space:nowrap}
header #stats b{color:var(--text);font-weight:600}
header .logo,header .tab,header .view-switch button,header .badge,header button{white-space:nowrap}

@media (max-width:1180px){
  .hdr-top .brand-tag{display:none}
  header #mode{max-width:190px}
  header .tab{padding:7px 11px}
}
@media (max-width:900px){
  header #mode{max-width:140px}
  header #stats{display:none}
  .hdr-top,.hdr-nav{padding:0 14px}
  .hdr-nav{padding-top:6px;padding-bottom:6px}
}


/* ---- 提示词模板 ---- */
.ptpl-subtab{display:inline-block;padding:10px 2px 8px;margin-right:22px;font-size:13.5px;color:var(--dim);cursor:pointer;border-bottom:2px solid transparent}
.ptpl-subtab.on{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}
.chip-on{background:rgba(56,189,248,.15)!important;border-color:var(--blue)!important;color:var(--blue)!important}
.ptpl-pre{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:14px;font-size:12.5px;line-height:1.7;white-space:pre-wrap;word-break:break-word;max-height:52vh;overflow:auto;margin:0}
.ptpl-ta{width:100%;min-height:300px;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.6;resize:vertical}
.ptpl-q{width:170px;padding:5px 10px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:12.5px}
.ptpl-sel{padding:5px 8px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:12.5px}
.ptpl-pg{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;padding:0 6px;border-radius:6px;border:1px solid var(--line);cursor:pointer;font-size:12.5px;margin:0 2px}
.ptpl-pg.on{background:var(--green2);border-color:var(--green2);color:#fff}
.ptpl-pg.off{opacity:.35;cursor:default}
.ptpl-act{color:var(--blue);cursor:pointer;text-decoration:none;margin-right:6px;font-size:12.5px}


/* ---- Widget 卡片与管理页 ---- */
.wg-card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;max-width:540px}
.wg-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wg-badge{font-size:10px;padding:1px 7px;border-radius:10px;background:rgba(56,189,248,.12);border:1px solid rgba(56,189,248,.35);color:var(--blue)}
.wg-title{font-weight:600;font-size:13.5px}
.wg-desc{font-size:12px;color:var(--dim);margin-top:4px;line-height:1.6}
.wg-icon{font-size:20px}
.wg-icon.sm{font-size:16px}
.wg-field{margin:10px 0}
.wg-field label{display:block;font-size:12px;color:var(--dim);margin-bottom:4px}
.wg-in{width:100%;box-sizing:border-box;padding:7px 10px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:12.5px;font-family:inherit}
.wg-opts{display:flex;flex-wrap:wrap;gap:8px 14px}
.wg-opt{display:flex;align-items:center;gap:5px;font-size:12.5px;cursor:pointer}
.wg-btn{background:var(--green2);color:#fff;border:0;padding:7px 16px;border-radius:6px;cursor:pointer;font-size:12.5px}
.wg-btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.wg-btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.wg-done{margin-top:10px;font-size:12px;color:var(--green);border-top:1px dashed var(--line);padding-top:8px}
.wg-item{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.wg-item:last-child{border-bottom:0}
.wg-steps{margin-top:10px}
.wg-step{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12.5px;color:var(--dim)}
.wg-step.done{color:var(--green)}
.wg-step.cur{color:var(--text);font-weight:600}

<script>































const $ = id => document.getElementById(id);































let S = {tab:'work', role:'builder', agents:[], published:[], cat:null, cur:null,































         editing:null, curTask:null, timer:null, tasks:[]};































































const TABS = [































  {id:'work',  name:'工作台',       roles:['builder','user']},































  {id:'build', name:'智能体构建',   roles:['builder']},































  {id:'skill', name:'技能库',       roles:['builder']},































  {id:'tool',  name:'工具与 MCP',   roles:['builder']},
  {id:'prompt', name:'提示词资产',   roles:['builder']},
  {id:'ptpl',  name:'提示词模板',   roles:['builder']},
  {id:'widget', name:'Widget',      roles:['builder']},































  {id:'task',  name:'任务中心',     roles:['builder','user']},















  {id:'monitor', name:'运行监控',   roles:['builder']}































];































































const API_TOKEN = "af_t0k3n_9f2a7c4e1b8d6a3f5c0e2b9d7a4f1c8";



async function api(u, o){































  o = o || {};

  const h = Object.assign({'Content-Type':'application/json'}, o.headers || {});

  h['Authorization'] = 'Bearer ' + API_TOKEN;
  try{ const _op = JSON.parse(localStorage.getItem('af_operator') || 'null');
       if(_op && _op.id){ h['X-Operator'] = encodeURIComponent(_op.id); h['X-Operator-Name'] = encodeURIComponent(_op.name || _op.id); } }catch(e){}

  o.headers = h;

  const r = await fetch(u, o);































  const t = await r.text();































  if(!r.ok){ let m = t; try{ m = JSON.parse(t).detail || t; }catch(e){} throw new Error(String(m).slice(0,300)); }































  try{ return JSON.parse(t); }catch(e){ return t; }































}































const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>































  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));































































/* ------------------------------------------------------------ 导航 */































function setRole(r){















  if(S.role === r) return;















  S.role = r;















  if(r === 'user' && ['work','task','monitor'].indexOf(S.tab) < 0) S.tab = 'work';















  renderTabs(); render();















}































function renderTabs(){















  const vs = $('viewSwitch');















  if(vs){















    vs.innerHTML =















      '<button class="' + (S.role==='builder'?'on':'') + '" onclick="setRole(\'builder\')">🛠 创建者</button>' +















      '<button class="' + (S.role==='user'?'on':'') + '" onclick="setRole(\'user\')">👔 业务人员</button>';















  }















  let h = TABS.filter(t => t.roles.indexOf(S.role) >= 0).map(t => {















    const onlyB = (t.roles.indexOf('user') < 0);















    return '<div class="tab' + (S.tab===t.id?' on':'') + (onlyB?' builder-only':'') + '" onclick="go(\'' + t.id + '\')">' + t.name + '</div>';















  }).join('');















  $('tabs').innerHTML = h;















  const rb = $('roleBanner');















  if(rb){















    if(S.role === 'builder'){















      rb.innerHTML = '🛠 <b>创建者视图</b> · 管理智能体 / 技能 / 工具与 MCP，并查看运行监控';















    }else{















      rb.innerHTML = '👔 <b>业务人员视图</b> · 使用已发布智能体进行对话与任务执行';















    }















  }















  document.body.className = 'role-' + S.role;















  /* 权限隔离：业务人员隐藏创建者专属 UI */







  const isBuilder = (S.role === 'builder');







  document.querySelectorAll('.builder-only-header').forEach(el => {







    el.style.display = isBuilder ? '' : 'none';







  });







}































function switchRole(){































  S.role = S.role === 'builder' ? 'user' : 'builder';































  if(S.role === 'user' && ['work','task'].indexOf(S.tab) < 0) S.tab = 'work';































  renderTabs(); render();































}































function go(t){ S.tab = t; stopPoll(); renderTabs(); render(); }































function stopPoll(){ if(S.timer){ clearInterval(S.timer); S.timer = null; } }































































// 渲染序号：并发 render（快速切 Tab）时，只有最新一次能写入，避免旧结果覆盖新结果































let renderSeq = 0;































function setView(v, seq, html){































  if(seq === renderSeq && v) v.innerHTML = html;































}































async function render(){































  const seq = ++renderSeq;































  const v = $('view');































  try{































    if(S.tab === 'work')  await viewWork(v, seq);































    if(S.tab === 'build') await viewBuild(v, seq);































    if(S.tab === 'skill') await viewSkill(v, seq);































    if(S.tab === 'tool')  await viewTool(v, seq);
    if(S.tab === 'engine'){ S.tab = 'work'; return render(); }
    if(S.tab === 'prompt') await viewPrompts(v, seq);
    if(S.tab === 'ptpl')  await viewPTpl(v, seq);
    if(S.tab === 'widget') await viewWidget(v, seq);































    if(S.tab === 'task')  await viewTask(v, seq);















    if(S.tab === 'monitor') await viewMonitor(v, seq);































  }catch(e){































    if(seq === renderSeq) v.innerHTML = '<div class="err">加载失败：' + esc(e.message) + '</div>';































  }































}































































/* ------------------------------------------------------------ 工作台 */































async function viewWork(v, seq){































  const d = await api('/api/agents?scope=published');































  S.published = d.items.filter(a => a.enabled !== 0);































  let h = '<div class="card"><div class="row"><b style="font-size:15px">业务工作台</b>' +































        '<span class="small">仅显示已发布且已启用的智能体 · 共 ' + S.published.length + ' 个</span></div>' +































        '<div class="small" style="margin-top:6px">选择智能体，以对话框方式交互，支持多轮对话与历史记录</div></div>';































  if(!S.published.length){































    h += '<div class="empty">还没有已发布的智能体。<br>切换到「构建者视图 - 智能体构建」，配置完成后点击发布。</div>';































  }else{































    h += '<div class="grid g4">' + S.published.map(a =>































      '<div class="agent-card" onclick="openRun(\'' + a.id + '\')">' +































      '<div class="ac-top"><span class="ac-icon">' + esc(a.icon || '?') + '</span>' +































      '<div><div class="ac-name">' + esc(a.name) + '</div>' +































      '<div class="small">' + esc(a.category || '') + '</div></div></div>' +































      '<div class="ac-desc">' + esc(a.description || '') + '</div>' +































      '<div class="ac-meta"><span class="badge b-pub">v' + a.version + '</span>' +































      '<span class="pill">' + esc(rtName(a.runtime)) + '</span>' +































      (a.skills.length ? '<span class="pill">技能 ' + a.skills.length + '</span>' : '') +































      (a.tools.length ? '<span class="pill">工具 ' + a.tools.length + '</span>' : '') + '</div>' +































      '</div>').join('') + '</div>';































  }































  setView(v, seq, h);































}































function rtName(id){ const r = (S.cat && S.cat.runtimes || []).find(x => x.id === id); return r ? r.name : id; }































































function formHTML(schema, prefix){































  return (schema || []).map(f => {































    const key = prefix + '_' + f.key;































    const lab = esc(f.label || f.key) + (f.required ? ' <span style="color:var(--red)">*</span>' : '');































    if(f.type === 'text') return '<div class="field"><label>' + lab + '</label>' +































      '<input id="' + key + '" placeholder="' + esc(f.placeholder || '') + '"></div>';































    if(f.type === 'number') return '<div class="field"><label>' + lab + '</label>' +































      '<input id="' + key + '" type="number" placeholder="' + esc(f.placeholder || '') + '"></div>';































    return '<div class="field"><label>' + lab + '</label>' +































      '<textarea id="' + key + '" placeholder="' + esc(f.placeholder || '') + '"></textarea></div>';































  }).join('');































}































function readForm(schema, prefix){































  const o = {};































  (schema || []).forEach(f => { const el = $(prefix + '_' + f.key); if(el) o[f.key] = el.value; });































  return o;































}































function checkForm(schema, prefix){































  const miss = (schema || []).filter(f => f.required && !($(prefix + '_' + f.key) && $(prefix + '_' + f.key).value.trim()));































  return miss.map(f => f.label || f.key);































}































































/* ==================== 聊天对话框（类 WorkBuddy 新建任务风格） ==================== */















let CS = {agentId:null, agentName:'', convId:null, messages:[], sending:false, convs:[]};































async function openRun(aid){















  let a = S.published.filter(x => x.id === aid)[0];















  if(!a) a = await api('/api/agents/' + aid);















  CS.agentId = aid;















  CS.agentName = a.name || aid;















  CS.convId = null;















  CS.messages = [];















  openChatModal(a);















}































function openChatModal(agent){















  const html =















    '<div class="chat-header">' +















      '<span class="ch-avatar">' + (agent.icon || '\u{1F916}') + '</span>' +















      '<span class="ch-title">' + esc(agent.name || '') +















        ' <span class="ch-sub">智能体对话</span></span>' +















      '<div class="ch-actions">' +















        '<button class="sm ghost" onclick="chatNewConv()">+ 新对话</button>' +















        '<button class="sm ghost" onclick="closeModal()">关闭</button>' +















      '</div>' +















    '</div>' +















    '<div class="chat-body">' +















      '<aside class="chat-sidebar">' +















        '<div class="chat-sidebar-h"><span>历史对话</span></div>' +















        '<div id="chatConvList"></div>' +















      '</aside>' +















      '<section class="chat-main">' +















        '<div class="chat-messages" id="chatMsgList"></div>' +















        '<div class="chat-typing" id="chatTyping" style="display:none">' +















          '<span></span><span></span><span></span> 思考中…</div>' +















        '<div class="chat-input-area">' +















          '<div class="chat-input-wrap">' +















            '<textarea class="chat-input" id="chatInput" rows="1" ' +















              'placeholder="输入消息…（Enter 发送，Shift+Enter 换行）" ' +















              'onkeydown="chatKeydown(event)" oninput="autoResize(this)"></textarea>' +















            '<button class="chat-send" id="chatSendBtn" onclick="chatSend()" title="发送">' +















              '<svg width="18" height="18" viewBox="0 0 24 24" fill="none">' +















              '<path d="M3 11.5L21 3l-8.5 18-2.2-7.3L3 11.5z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>' +















            '</button>' +















          '</div>' +















        '</div>' +















      '</section>' +















    '</div>';















  openModal(html);















  $('modal').className = 'chat-modal';















  chatLoadConvs();















  chatNewConv();















  setTimeout(() => { const el=$('chatInput'); if(el){el.focus(); autoResize(el);} }, 120);















}































function autoResize(el){ el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,140)+'px'; }































function chatKeydown(e){















  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); chatSend(); }















}































async function chatNewConv(){















  if(CS.sending) return;















  CS.convId = null;















  CS.messages = [];















  renderChatMessages();















  const el=$('chatInput'); if(el){ el.value=''; el.focus(); }















}































async function chatSend(){















  const el=$('chatInput');















  const msg=el.value.trim();















  if(!msg || CS.sending) return;















  el.value='';















  autoResize(el);















  CS.sending=true;















  $('chatSendBtn').disabled=true;















  if(!CS.convId){















    try{















      const r=await api('/api/conversations',{method:'POST',body:JSON.stringify({agent_id:CS.agentId,title:msg.slice(0,40)})});















      CS.convId=r.id;















    }catch(e){ console.error(e); }















  }















  CS.messages.push({role:'user', content:msg});















  renderChatMessages();















  chatScrollBottom();















  $('chatTyping').style.display='flex';















  chatScrollBottom();















  // ---- 流式输出：SSE 逐字渲染（后端 /api/chat stream 模式） ----
  CS.messages.push({role:'assistant', content:'', model:''});
  const lastMsg=CS.messages[CS.messages.length-1];
  renderChatMessages();
  const listEl=$('chatMsgList');
  let tNode=null;
  if(listEl){
    const bubbles=listEl.querySelectorAll('.chat-msg');
    const b=bubbles[bubbles.length-1];
    if(b){ tNode=document.createTextNode(''); b.insertBefore(tNode, b.firstChild); }
  }
  let streamed=false;
  try{
    const h={'Content-Type':'application/json','Authorization':'Bearer '+API_TOKEN};
    try{ const _op=JSON.parse(localStorage.getItem('af_operator')||'null');
         if(_op&&_op.id){ h['X-Operator']=encodeURIComponent(_op.id); h['X-Operator-Name']=encodeURIComponent(_op.name||_op.id); } }catch(e){}
    const resp=await fetch('/api/chat',{method:'POST',headers:h,body:JSON.stringify({
      conversation_id:CS.convId, agent_id:CS.agentId, message:msg, stream:true })});
    const ctype=resp.headers.get('content-type')||'';
    if(!resp.ok){
      const t=await resp.text(); let m=t;
      try{ m=JSON.parse(t).detail||t; }catch(e){}
      throw new Error(String(m).slice(0,300));
    }
    if(ctype.indexOf('text/event-stream')<0 || !resp.body){
      throw new Error('流式不可用');
    }
    streamed=true;
    $('chatTyping').style.display='none';
    const reader=resp.body.getReader();
    const dec=new TextDecoder('utf-8');
    let buf='';
    while(true){
      const {done,value}=await reader.read();
      if(done) break;
      buf+=dec.decode(value,{stream:true});
      let idx;
      while((idx=buf.indexOf('\n\n'))>=0){
        const chunk=buf.slice(0,idx);
        buf=buf.slice(idx+2);
        if(chunk.indexOf('data:')!==0) continue;
        let ev; try{ ev=JSON.parse(chunk.slice(5).trim()); }catch(e){ continue; }
        if(ev.t==='meta'){
          if(ev.conversation_id) CS.convId=ev.conversation_id;
          if(ev.prompt_log_id) lastMsg.logId=ev.prompt_log_id;
        }else if(ev.t==='delta'){
          lastMsg.content+=ev.v;
          if(tNode) tNode.textContent=wgStreamText(lastMsg.content);
          chatScrollBottom();
        }else if(ev.t==='done'){
          lastMsg.model=ev.model||''; lastMsg.mocked=!!ev.mocked;
        }else if(ev.t==='error'){
          lastMsg.error=true;
          lastMsg.content+='⚠️ 模型调用失败: '+(ev.error||'');
          if(tNode) tNode.textContent=wgStreamText(lastMsg.content);
        }
      }
    }
  }catch(e){
    if(!streamed || !lastMsg.content){
      lastMsg.content='⚠️ 请求失败: '+(e.message||'');
      lastMsg.error=true;
    }else{
      lastMsg.error=true;
      lastMsg.content+='\n⚠️ 连接中断: '+(e.message||'');
    }
  }
  $('chatTyping').style.display='none';
  renderChatMessages();
  chatScrollBottom();















  CS.sending=false;















  $('chatSendBtn').disabled=false;















  el.focus();















  chatLoadConvs();















}































function renderChatMessages(){















  const c=$('chatMsgList');















  if(!c) return;















  if(!CS.messages.length){















    c.innerHTML='<div class="chat-empty"><div style="text-align:center"><div style="font-size:34px;margin-bottom:8px">💬</div>开始一段新对话吧</div></div>';















    return;















  }















  c.innerHTML=CS.messages.map((m,mi)=>{















    const cls='chat-msg '+(m.role==='user'?'user':'assistant')+(m.error?' error':'');















    const meta=(m.role==='assistant') ?















      '<div class="cm-meta">'+(m.model?'<span>'+esc(m.model)+'</span>':'')+















      (m.mocked?'<span class="badge b-mock" style="padding:1px 6px;font-size:10px">模拟</span>':'')+'</div>' : '';















    const fb=(m.role==='assistant' && m.logId) ?
      '<div style="margin-top:8px;display:flex;gap:14px;font-size:12px">'+
      '<span style="cursor:pointer;color:var(--dim)" onclick="promptFeedback('+m.logId+',\'up\',this)">赞同</span>'+
      '<span style="cursor:pointer;color:var(--dim)" onclick="promptFeedback('+m.logId+',\'down\',this)">反对</span>'+
      '<span style="cursor:pointer;color:var(--dim)" onclick="promptFeedback('+m.logId+',\'adopt\',this)">采纳</span>'+
      '<span style="cursor:pointer;color:var(--dim)" onclick="promptCopy('+m.logId+',this)">复制</span>'+
      '</div>' : '';
    return '<div class="'+cls+'">'+(m.role==='assistant'?wgRenderContent(m.content,mi):esc(m.content))+meta+fb+'</div>';















  }).join('');















}































function chatScrollBottom(){ const el=$('chatMsgList'); if(el) el.scrollTop=el.scrollHeight; }































async function chatLoadConvs(){















  try{















    const r=await api('/api/conversations?agent_id='+encodeURIComponent(CS.agentId||'')+'&limit=30');















    CS.convs=(r.items||[]);















    const box=$('chatConvList');















    if(!box) return;















    if(!CS.convs.length){















      box.innerHTML='<div class="chat-conv-empty">暂无历史对话<br>发送一条消息开始吧</div>';















      return;















    }















    box.innerHTML=CS.convs.map(cv=>{















      const on=(cv.id===CS.convId)?' on':'';















      const time=cv.last_msg_at?fmtTime(cv.last_msg_at):'';















      return '<div class="chat-conv-item'+on+'" onclick="chatSwitchConv(\''+cv.id+'\')">'+















        '<div class="cc-title">'+esc(cv.title||'未命名对话')+'</div>'+















        '<div class="cc-time">'+time+' · '+(cv.msg_count||0)+' 条</div></div>';















    }).join('');















  }catch(e){ console.error(e); }















}































async function chatSwitchConv(cid){















  if(CS.sending) return;















  CS.convId=cid;















  try{















    const d=await api('/api/conversations/'+cid);















    CS.messages=(d.messages||[]).map(m=>({role:m.role, content:m.content||'', error:!!m.error, model:m.model||'', mocked:!!m.mocked}));















    renderChatMessages();















    chatScrollBottom();















    const all=document.querySelectorAll('.chat-conv-item');















    all.forEach(it=>{















      const oc=it.getAttribute('onclick')||'';















      if(oc.indexOf("'"+cid+"'")>=0) it.classList.add('on'); else it.classList.remove('on');















    });















  }catch(e){ console.error(e); }















}































function fmtTime(ts){















  if(!ts) return '';















  const d=new Date(ts*1000);















  const now=new Date();















  if(d.toDateString()===now.toDateString()) return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);















  return (d.getMonth()+1)+'/'+d.getDate();















}































async function submitRun(aid){































  const a = S.published.filter(x => x.id === aid)[0];































  const miss = checkForm(a.input_schema, 'r');































  if(miss.length){ $('runmsg').textContent = '请填写：' + miss.join('、'); return; }































  $('runmsg').textContent = '提交中…';































  try{































    const r = await api('/api/tasks', {method:'POST', body:JSON.stringify(































      {agent_id:aid, input:readForm(a.input_schema, 'r'), published_only:true})});































    $('runmsg').textContent = '执行中…';































    pollRun(r.id);































  }catch(e){ $('runmsg').innerHTML = '<span style="color:var(--red)">' + esc(e.message) + '</span>'; }































}































function pollRun(tid){































  stopPoll();































  S.timer = setInterval(async () => {

].join('\n');

/* 人设越界检测：技能正文里不该出现身份设定 */
function skillPersonaHit(text){
  const t = text || '';
  const hits = [];
  if(/^[ \t]*#{1,6}[ \t]*(角色|人设|身份|你是谁)[ \t]*$/m.test(t)) hits.push('出现了「角色 / 人设」小节标题');
  const m = t.match(/你(是|将扮演|扮演|需要扮演)[^，。；\n]{0,20}?(专家|顾问|工程师|助手|经理|分析师|架构师|教练|老师|专员|主管)/);
  if(m) hits.push('出现了「' + m[0] + '」这类身份设定');
  if(/你(的)?(职责|任务)是/.test(t)) hits.push('出现了「你的职责是…」这类身份设定');
  if(/请(以|用)[^，。；\n]{0,12}的(身份|角色|口吻)/.test(t)) hits.push('出现了「以…的身份」这类身份设定');
  return hits.length ? hits.join('；') : '';
}

}

function fmtNum(n){ n=n||0; if(n>=1e6) return (n/1e6).toFixed(2)+'M'; if(n>=1e3) return (n/1e3).toFixed(1)+'k'; return n; }































function renderDailyChart(items){















  const arr = (items||[]).slice().reverse();















  if(!arr.length) return '<div class="card"><div class="card-h">近 14 天趋势</div><div class="empty">暂无数据</div></div>';















  const W=920, H=170, pad=26, slot=(W-pad*2)/arr.length, bw=Math.max(6, slot-6);















  const maxN = Math.max(1, ...arr.map(x=>x.n));















  const maxT = Math.max(1, ...arr.map(x=>(x.ti||0)+(x.to_||0)));















  let bars='', labels='';















  arr.forEach((x,i)=>{















    const x0 = pad + i*slot + 3;















    const hN = (x.n/maxN)*(H-pad*2);















    const hT = ((x.ti+x.to_)/maxT)*(H-pad*2);















    bars += '<rect x="'+x0+'" y="'+(H-pad-hN)+'" width="'+bw+'" height="'+hN+'" rx="2" fill="var(--green)" opacity=".85"/>';















    bars += '<rect x="'+x0+'" y="'+(H-pad-hT)+'" width="'+bw+'" height="'+hT+'" rx="2" fill="var(--blue)" opacity=".30"/>';















    labels += '<text x="'+(x0+bw/2)+'" y="'+(H-7)+'" fill="var(--dim)" font-size="9" text-anchor="middle">'+((x.d||'').slice(5))+'</text>';















  });















  return '<div class="card"><div class="card-h">近 14 天趋势 <span class="small">（绿=调用次数，蓝=Token 量）</span></div>'+















         '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto">'+















         '<line x1="'+pad+'" y1="'+(H-pad)+'" x2="'+(W-pad)+'" y2="'+(H-pad)+'" stroke="var(--line)"/>'+















         bars+labels+'</svg></div>';















}































function renderModelBars(items){















  if(!items || !items.length) return '<div class="empty">暂无数据</div>';















  const max = Math.max(1, ...items.map(x=>x.n));















  return items.map(m=>{















    const w = Math.round(m.n/max*100);















    return '<div class="mbar"><div class="mb-label"><span>'+esc(m.model||'?')+'</span>'+















           '<span class="small">'+m.n+' 次 · '+fmtNum(m.ti+m.to_)+' tok · $'+m.cost_usd.toFixed(3)+'</span></div>'+















           '<div class="mb-track"><i style="width:'+w+'%"></i></div></div>';















  }).join('');















}

/* ------------------------------------------------------------ 提示词模板（参照腾讯云ADP） */
const PT = {tab:'builtin', tag:'', ttype:'', q:'', fav:false, page:1, size:15, items:[], total:0, types:[]};
const PT_TAGS = ['全部','多Agent协同','任务执行','工具调用','文本创作','文本理解','角色扮演',
                 '翻译','结构化生成','知识库问答','代码编程','评测','意图识别','参数提取','提示词优化'];

async function viewPTpl(v, seq){
  await ptplLoad();
  setView(v, seq, renderPTpl());
}
async function ptplLoad(){
  const qs = ['tab=' + PT.tab];
  if(PT.tag && PT.tag !== '全部') qs.push('tag=' + encodeURIComponent(PT.tag));
  if(PT.ttype) qs.push('ttype=' + encodeURIComponent(PT.ttype));
  if(PT.q) qs.push('q=' + encodeURIComponent(PT.q));
  if(PT.fav) qs.push('fav=1');
  qs.push('page=' + PT.page + '&size=' + PT.size);
  try{
    const d = await api('/api/ptpl?' + qs.join('&'));
    PT.items = d.items || []; PT.total = d.total || 0; PT.types = d.types || [];
    if(PT.page > 1 && !PT.items.length && d.total > 0){ PT.page = 1; return ptplLoad(); }
  }catch(e){ PT.items = []; PT.total = 0; PT.types = PT.types || []; }
}
function ptplRepaint(){ const v = $('view'); if(v && S.tab === 'ptpl') v.innerHTML = renderPTpl(); }
function ptplGo(){ viewPTpl($('view'), renderSeq); }
function ptplFilter(k, val){ PT[k] = val; PT.page = 1; ptplGo(); }

function renderPTpl(){
  const total = PT.total, pages = Math.max(1, Math.ceil(total / PT.size));
  let h = '<div class="card"><div class="row" style="align-items:center;flex-wrap:wrap">' +
    '<b style="font-size:15px">提示词模板</b>' +
    '<span class="small" style="margin-left:10px">内置模板可直接查看复制 · 自定义模板支持版本管理与回滚</span>' +
    '<span class="spacer" style="flex:1"></span>' +
    '<button class="ghost sm" onclick="ptplEdit(null)">+ 新建模板</button>' +
    '</div></div>';

  /* 子标签：内置 / 自定义 */
  const sub = (id, name) =>
    '<span class="ptpl-subtab' + (PT.tab === id ? ' on' : '') + '" onclick="ptplFilter(\'tab\',\'' + id + '\')">' + name + '</span>';
  h += '<div class="card" style="padding:4px 14px 0">' + sub('builtin','内置模板') + sub('custom','自定义模板') + '</div>';

  /* 过滤行：标签chips + 收藏 + 类型 + 搜索 + 刷新 */
  h += '<div class="card"><div class="row" style="gap:8px;flex-wrap:wrap;align-items:center">' +
    PT_TAGS.map(t => '<span class="chip' + (PT.tag === t ? ' chip-on' : '') + '" style="cursor:pointer" onclick="ptplFilter(\'tag\',\'' + t + '\')">' + t + '</span>').join('') +
    '<span style="flex:1"></span>' +
    '<label class="small" style="cursor:pointer;display:flex;align-items:center;gap:4px">' +
    '<input type="checkbox"' + (PT.fav ? ' checked' : '') + ' onchange="ptplFilter(\'fav\',this.checked)">☆ 收藏</label>' +
    '<select class="ptpl-sel" onchange="ptplFilter(\'ttype\',this.value)">' +
    '<option value="">全部类型</option>' +
    (PT.types || []).map(t => '<option value="' + esc(t) + '"' + (PT.ttype === t ? ' selected' : '') + '>' + esc(t) + '</option>').join('') +
    '</select>' +
    '<input class="ptpl-q" id="ptplQ" placeholder="搜索标题/概述" value="' + esc(PT.q) + '" onkeydown="if(event.key===\'Enter\'){ptplFilter(\'q\',this.value.trim())}">' +
    '<button class="ghost sm" onclick="ptplFilter(\'q\',($(\'ptplQ\')||{}).value?$(\'ptplQ\').value.trim():\'\')">搜索</button>' +
    '<button class="ghost sm" title="刷新" onclick="ptplGo()">⟳</button>' +
    '</div></div>';

  /* 表格 */
  if(!PT.items.length){
    h += '<div class="empty">当前筛选条件下没有模板。<br>' + (PT.tab === 'custom' ? '点击右上角「+ 新建模板」创建，或在内置模板里点「另存为」。<br>' : '换个标签或清空搜索条件试试。<br>') + '</div>';
  }else{
    h += '<div class="card"><table><tr><th style="width:190px">标题</th><th>概述</th><th style="width:120px">类型</th><th style="width:150px">标签</th><th style="width:70px">版本</th><th style="width:110px">创建人</th><th style="width:230px">操作</th></tr>';
    PT.items.forEach(t => {
      const tags = (t.tags || '').split(',').filter(x => x.trim()).map(x => '<span class="chip">' + esc(x.trim()) + '</span>').join(' ');
      const acts = [];
      acts.push('<a class="ptpl-act" onclick="ptplView(' + t.id + ')">查看</a>');
      acts.push('<a class="ptpl-act" onclick="ptplCopy(' + t.id + ')">复制</a>');
      if(t.builtin){
        acts.push('<a class="ptpl-act" onclick="ptplDup(' + t.id + ')">另存为</a>');
      }else{
        acts.push('<a class="ptpl-act" onclick="ptplEdit(' + t.id + ')">编辑</a>');
        acts.push('<a class="ptpl-act" onclick="ptplVersions(' + t.id + ')">版本</a>');
        acts.push('<a style="color:var(--red)" onclick="ptplDel(' + t.id + ')">删除</a>');
      }
      h += '<tr>' +
        '<td><span style="cursor:pointer" title="收藏" onclick="ptplFav(' + t.id + ')">' + (t.favorite ? '★' : '☆') + '</span> ' + esc(t.title) + '</td>' +
        '<td class="small" style="color:var(--dim)">' + esc(t.overview || '') + '</td>' +
        '<td>' + esc(t.ttype || '') + '</td>' +
        '<td>' + tags + '</td>' +
        '<td>v' + (t.current_version || 1) + '</td>' +
        '<td class="small" style="color:var(--dim)">' + esc(t.creator || '智能体开发平台') + '</td>' +
        '<td>' + acts.join(' ') + '</td>' +
        '</tr>';
    });
    h += '</table></div>';
  }

  /* 分页 */
  const pg = [];
  const add = p => pg.push('<span class="ptpl-pg' + (p === PT.page ? ' on' : '') + '" onclick="ptplPage(' + p + ')">' + p + '</span>');
  const dots = () => pg.push('<span class="small" style="padding:0 4px">…</span>');
  const from = Math.max(1, PT.page - 2), to = Math.min(pages, PT.page + 2);
  if(from > 1){ add(1); if(from > 2) dots(); }
  for(let p = from; p <= to; p++) add(p);
  if(to < pages){ if(to < pages - 1) dots(); add(pages); }
  h += '<div class="card"><div class="row" style="align-items:center">' +
    '<span class="small">共 ' + total + ' 项，每页显示</span>' +
    '<select class="ptpl-sel" onchange="PT.size=+this.value;ptplPage(1)">' +
    [15,30,50].map(n => '<option value="' + n + '"' + (PT.size === n ? ' selected' : '') + '>' + n + '</option>').join('') + '</select>' +
    '<span style="flex:1"></span>' +
    (PT.page > 1 ? '<span class="ptpl-pg" onclick="ptplPage(' + (PT.page - 1) + ')">&lt;</span>' : '<span class="ptpl-pg off">&lt;</span>') +
    pg.join('') +
    (PT.page < pages ? '<span class="ptpl-pg" onclick="ptplPage(' + (PT.page + 1) + ')">&gt;</span>' : '<span class="ptpl-pg off">&gt;</span>') +
    '<span class="small" style="margin-left:10px">跳至</span>' +
    '<input class="ptpl-q" style="width:44px" id="ptplJump" value="' + PT.page + '" onkeydown="if(event.key===\'Enter\'){ptplPage(+this.value||1)}">' +
    '<span class="small">页</span>' +
    '</div></div>';
  return h;
}
function ptplPage(p){ p = Math.max(1, Math.min(9999, +p || 1)); if(p === PT.page){ ptplRepaint(); return; } PT.page = p; ptplGo(); }

function ptplToast(text, ok){
  let d = document.createElement('div');
  d.textContent = text;
  d.style.cssText = 'position:fixed;top:60px;right:24px;z-index:9999;padding:10px 16px;border-radius:8px;' +

/* ------------------------------------------------------------ Widget：卡片渲染（聊天打通） */
/* 智能体回复中的 ```widget JSON 块 → 交互卡片；操作后以文本回传会话（对齐 ADP Action 协议） */

const WG_TYPES = ['form','confirm','info','list','progress'];
function wgRenderContent(content, mi){
  const t = content || '';
  if(t.indexOf('```') < 0) return esc(t);
  const re = /```(widget|json)[ \t]*\r?\n?([\s\S]*?)```/g;
  let out = '', last = 0, m, bi = 0;
  while((m = re.exec(t))){
    out += esc(t.slice(last, m.index));
    let spec = null;
    try{ spec = JSON.parse(m[2].trim()); }catch(e){}
    const isWg = spec && WG_TYPES.indexOf(spec.type) >= 0;
    if((m[1] === 'widget' && spec && spec.type) || isWg){
      out += wgCardHTML(spec, wgKey(mi, bi), false);
    }else{
      out += '<pre class="wg-pre">' + esc(m[2]) + '</pre>';
    }
    bi++; last = re.lastIndex;
  }
  out += esc(t.slice(last));
  return out;
}
function wgKey(mi, bi){ return (CS.convId || 'c') + ':' + mi + ':' + bi; }

function wgStreamText(t){
  if(!t || t.indexOf('```') < 0) return t;
  let out = t.replace(/```widget[ \t]*\r?\n?[\s\S]*?```/g, '［交互卡片］');
  out = out.replace(/```json[ \t]*\r?\n?\s*\{\s*"type"\s*:[\s\S]*?```/g, '［交互卡片］');
  const i = out.indexOf('```widget');
  if(i >= 0) out = out.slice(0, i) + '（生成交互卡片中…）';
  return out;
}

function wgCardHTML(spec, key, isStatic){
  if(!CS.wgUsed) CS.wgUsed = {};
  const used = !isStatic && CS.wgUsed[key];
  const attrs = 'class="wg-card" data-k="' + key + '" data-title="' + esc(spec.title || '') + '"' +
                (spec.type ? ' data-type="' + esc(spec.type) + '"' : '');
  let h = '<div ' + attrs + '>';
  const title = '<div class="wg-title">' + esc(spec.title || '') + '</div>';
  const desc = spec.desc ? '<div class="wg-desc">' + esc(spec.desc) + '</div>' : '';
  const badge = '<span class="wg-badge">Widget</span>';

  if(spec.type === 'form'){
    h += '<div class="wg-head">' + badge + title + '</div>' + desc;
    (spec.fields || []).forEach((f, i) => {
      const nm = esc(f.name || ('字段' + (i + 1)));
      const dis = used ? ' disabled' : '';
      h += '<div class="wg-field"><label>' + nm + '</label>';
      const dn = ' data-name="' + esc(f.name || '') + '"';
      if(f.kind === 'textarea'){
        h += '<textarea class="wg-in"' + dn + ' rows="2" placeholder="' + esc(f.placeholder || '') + '"' + dis + '></textarea>';
      }else if(f.kind === 'select'){
        h += '<select class="wg-in"' + dn + dis + '><option value="">请选择</option>' +
          (f.options || []).map(o => '<option>' + esc(o) + '</option>').join('') + '</select>';
      }else if(f.kind === 'radio'){
        h += '<div class="wg-opts">' + (f.options || []).map(o =>
          '<label class="wg-opt"><input type="radio" name="' + key + '-' + i + '"' + dn + ' value="' + esc(o) + '"' + dis + '>' + esc(o) + '</label>').join('') + '</div>';
      }else if(f.kind === 'checkbox'){
        h += '<div class="wg-opts">' + (f.options || []).map(o =>
          '<label class="wg-opt"><input type="checkbox"' + dn + ' value="' + esc(o) + '"' + dis + '>' + esc(o) + '</label>').join('') + '</div>';
      }else{
        h += '<input class="wg-in"' + dn + ' placeholder="' + esc(f.placeholder || '') + '"' + dis + '>';
      }
      h += '</div>';
    });
    h += used ? '<div class="wg-done">已提交</div>'
              : (isStatic ? '<button class="wg-btn" onclick="wgPreviewHint()">提交</button>'
                          : '<button class="wg-btn" onclick="wgFormSubmit(\'' + key + '\')">' + esc(spec.submit || '提交') + '</button>');
  }
  else if(spec.type === 'confirm'){
    h += '<div class="wg-head">' + badge + title + '</div>' + desc;
    if(used){
      h += '<div class="wg-done">' + (used.ok ? '已确认' : '已取消') + '</div>';
    }else if(isStatic){
      h += '<div class="wg-btns"><button class="wg-btn" onclick="wgPreviewHint()">' + esc(spec.ok || '确认') + '</button>' +
           '<button class="wg-btn ghost" onclick="wgPreviewHint()">' + esc(spec.cancel || '取消') + '</button></div>';
    }else{
      h += '<div class="wg-btns"><button class="wg-btn" onclick="wgConfirm(\'' + key + '\',1)">' + esc(spec.ok || '确认') + '</button>' +
           '<button class="wg-btn ghost" onclick="wgConfirm(\'' + key + '\',0)">' + esc(spec.cancel || '取消') + '</button></div>';
    }
  }
  else if(spec.type === 'info'){
    h += '<div class="wg-head">' + badge +
      (spec.icon ? '<span class="wg-icon">' + esc(spec.icon) + '</span>' : '') + title + '</div>' + desc;
    if(spec.buttons && spec.buttons.length){
      h += '<div class="wg-btns">' + spec.buttons.map(b =>
        '<button class="wg-btn' + (b.download ? ' ghost' : '') + '" onclick="wgBtnClick(this)" data-url="' + esc(b.url || '') + '"' +
        (b.download ? ' data-dl="' + esc(b.filename || '') + '"' : '') + '>' + esc(b.text || '打开') + '</button>').join('') + '</div>';
    }
  }
  else if(spec.type === 'list'){
    h += '<div class="wg-head">' + badge + title + '</div>';
    (spec.items || []).forEach(it => {
      h += '<div class="wg-item">' + (it.icon ? '<span class="wg-icon sm">' + esc(it.icon) + '</span>' : '') +
        '<div><div>' + esc(it.title || '') + '</div>' +
        (it.subtitle ? '<div class="wg-desc">' + esc(it.subtitle) + '</div>' : '') + '</div></div>';
    });
  }
  else if(spec.type === 'progress'){
    const cur = spec.current || 0;
    h += '<div class="wg-head">' + badge + title + '</div>' + desc;
    h += '<div class="wg-steps">' + (spec.steps || []).map((s, i) =>
      '<div class="wg-step ' + (i + 1 < cur ? 'done' : (i + 1 === cur ? 'cur' : '')) + '">' +
      '<span class="wg-dot">' + (i + 1 < cur ? '✓' : (i + 1)) + '</span>' + esc(s) + '</div>').join('') + '</div>';
  }
  else{
    h += '<pre class="wg-pre">' + esc(JSON.stringify(spec, null, 2)) + '</pre>';
  }
  return h + '</div>';
}

function wgPreviewHint(){ wtToast('预览模式：实际对话中此卡片可交互，操作会回传给智能体'); }

function wgBtnClick(btn){
  const url = btn.getAttribute('data-url');
  if(!url) return;
  if(btn.hasAttribute('data-dl')){
    const a = document.createElement('a');
    a.href = url; a.download = btn.getAttribute('data-dl') || '';
    document.body.appendChild(a); a.click(); a.remove();
  }else{
    window.open(url, '_blank');
  }
}

function wgFormSubmit(key){
  const card = document.querySelector('.wg-card[data-k="' + key + '"]');
  if(!card) return;
  const vals = {};
  card.querySelectorAll('[data-name]').forEach(el => {
    const n = el.getAttribute('data-name');
    if(el.type === 'checkbox'){ if(el.checked) (vals[n] = vals[n] || []).push(el.value); }
    else if(el.type === 'radio'){ if(el.checked) vals[n] = el.value; }
    else if(el.value) vals[n] = el.value;
  });
  CS.wgUsed[key] = {ok: true};
  renderChatMessages();
  wgSend('【卡片提交·' + (card.getAttribute('data-title') || '表单') + '】' + JSON.stringify(vals));
}

function wgConfirm(key, ok){
  const card = document.querySelector('.wg-card[data-k="' + key + '"]');
  if(!card) return;
  CS.wgUsed[key] = {ok: !!ok};
  renderChatMessages();
  wgSend('【卡片确认·' + (card.getAttribute('data-title') || '操作') + '】' + (ok ? '已确认' : '已取消'));
}

function wgSend(text){
  const el = $('chatInput');
  if(!el) return;
  el.value = text;
  try{ autoResize(el); }catch(e){}
  chatSend();
}

/* ------------------------------------------------------------ Widget 管理菜单 */
const WT = {tab:'builtin', cat:'', q:'', page:1, size:12, items:[], total:0};
const WT_CATS = ['全部','澄清询问','表单提交','操作确认','简单信息','列表信息','过程反馈'];

async function viewWidget(v, seq){
  await wtLoad();
  setView(v, seq, renderWidgetPage());
}
async function wtLoad(){
  const qs = ['tab=' + WT.tab];
  if(WT.cat) qs.push('cat=' + encodeURIComponent(WT.cat));
  if(WT.q) qs.push('q=' + encodeURIComponent(WT.q));
  qs.push('page=' + WT.page + '&size=' + WT.size);
  try{
    const d = await api('/api/widgets?' + qs.join('&'));
    WT.items = d.items || []; WT.total = d.total || 0;
    if(WT.page > 1 && !WT.items.length && WT.total > 0){ WT.page = 1; return wtLoad(); }
  }catch(e){ WT.items = []; WT.total = 0; }
}
function wtRepaint(){ const v = $('view'); if(v && S.tab === 'widget') v.innerHTML = renderWidgetPage(); }
function wtGo(){ viewWidget($('view'), renderSeq); }
function wtFilter(k, val){ WT[k] = val; WT.page = 1; wtGo(); }
function wtToast(text){
  let d = document.createElement('div');
  d.textContent = text;
  d.style.cssText = 'position:fixed;top:60px;right:24px;z-index:9999;padding:10px 16px;border-radius:8px;' +
    'background:var(--green2);color:#fff;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.4)';
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 2200);
}

function renderWidgetPage(){
  let h = '<div class="card"><div class="row" style="align-items:center;flex-wrap:wrap">' +
    '<b style="font-size:15px">Widget</b>' +
    '<span class="small" style="margin-left:10px">对话中的交互卡片：收集信息 · 触发操作 · 展示内容，提升对话体验</span>' +
    '<span class="spacer" style="flex:1"></span>' +
    '<button class="ghost sm" onclick="wtEdit(null)">+ 新建 Widget</button>' +
    '</div></div>';

  const sub = (id, name) =>
    '<span class="ptpl-subtab' + (WT.tab === id ? ' on' : '') + '" onclick="wtFilter(\'tab\',\'' + id + '\')">' + name + '</span>';
  h += '<div class="card" style="padding:4px 14px 0">' + sub('builtin','Widget 模板') + sub('custom','我的 Widget') + '</div>';

  h += '<div class="card"><div class="row" style="gap:8px;flex-wrap:wrap;align-items:center">' +
    WT_CATS.map(c => '<span class="chip' + (WT.cat === c ? ' chip-on' : '') + '" style="cursor:pointer" onclick="wtFilter(\'cat\',\'' + c + '\')">' + c + '</span>').join('') +
    '<span style="flex:1"></span>' +
    '<input class="ptpl-q" id="wtQ" placeholder="搜索 Widget" value="' + esc(WT.q) + '" onkeydown="if(event.key===\'Enter\'){wtFilter(\'q\',this.value.trim())}">' +
    '<button class="ghost sm" onclick="wtFilter(\'q\',($(\'wtQ\')||{}).value?$(\'wtQ\').value.trim():\'\')">搜索</button>' +
    '<button class="ghost sm" title="刷新" onclick="wtGo()">⟳</button>' +
    '</div></div>';

  if(!WT.items.length){
    h += '<div class="empty">当前条件下没有 Widget。<br>' + (WT.tab === 'custom' ? '点击右上角「+ 新建 Widget」创建，或在模板里点「另存为」。<br>' : '换个分类或清空搜索条件试试。<br>') + '</div>';
  }else{
    h += '<div class="wt-grid">';
    WT.items.forEach(w => {
      h += '<div class="wt-card">' +
        '<div class="row" style="align-items:center"><b style="font-size:13.5px">' + esc(w.name) + '</b>' +
        '<span class="spacer" style="flex:1"></span><span class="chip">' + esc(w.category || '') + '</span></div>' +
        '<div class="small" style="color:var(--dim);margin:6px 0;min-height:32px">' + esc(w.description || '') + '</div>' +
        '<div class="wt-preview">' + wgCardHTML(w.spec || {}, 'pv' + w.id, true) + '</div>' +
        '<div class="row" style="margin-top:10px;gap:10px">' +
        '<a class="ptpl-act" onclick="wtView(' + w.id + ')">查看</a>' +
        '<a class="ptpl-act" onclick="wtCopySpec(' + w.id + ')">复制JSON</a>' +
        (w.builtin ? '<a class="ptpl-act" onclick="wtDup(' + w.id + ')">另存为</a>'
                   : '<a class="ptpl-act" onclick="wtEdit(' + w.id + ')">编辑</a> <a class="ptpl-act" style="color:var(--red)" onclick="wtDel(' + w.id + ')">删除</a>') +
        '</div></div>';
    });
    h += '</div>';
  }

  const pages = Math.max(1, Math.ceil(WT.total / WT.size));
  if(pages > 1){
    h += '<div class="card"><div class="row" style="align-items:center">' +
      '<span class="small">共 ' + WT.total + ' 个</span><span style="flex:1"></span>';
    for(let p = 1; p <= pages && p <= 8; p++){
      h += '<span class="ptpl-pg' + (p === WT.page ? ' on' : '') + '" onclick="wtPage(' + p + ')">' + p + '</span>';
    }
    h += '</div></div>';
  }
  return h;
}
function wtPage(p){ WT.page = Math.max(1, p); wtGo(); }

function wtFind(id){ return WT.items.filter(x => x.id === id)[0]; }

async function wtView(id){
  try{
    const w = await api('/api/widgets/' + id);
    openModal('<div class="row" style="align-items:center"><b style="font-size:15px">' + esc(w.name) + '</b>' +
      '<span class="chip">' + esc(w.category || '') + '</span><span class="spacer" style="flex:1"></span>' +
      (w.builtin ? '<button class="ghost sm" onclick="wtDup(' + id + ')">另存为我的 Widget</button>' : '') +
      '</div>' +
      '<div class="small" style="margin:8px 0;color:var(--dim)">' + esc(w.description || '') + ' · 创建人 ' + esc(w.creator || 'AgentForge 平台') + ' · 被复制 ' + (w.copy_count || 0) + ' 次</div>' +
      '<div class="wg-tabs"><span class="ptpl-subtab on" id="wgTabPv" onclick="wtShowTab(0)">预览</span>' +
      '<span class="ptpl-subtab" id="wgTabJs" onclick="wtShowTab(1)">JSON</span></div>' +
      '<div id="wgPvBox">' + wgCardHTML(w.spec || {}, 'pv-m' + id, true) + '</div>' +
      '<pre class="ptpl-pre" id="wgJsBox" style="display:none">' + esc(JSON.stringify(w.spec || {}, null, 2)) + '</pre>' +
      '<div class="row" style="margin-top:12px"><button class="ghost" onclick="closeModal()">关闭</button></div>');
  }catch(e){ wtToast(e.message); }
}
function wtShowTab(which){
  $('wgPvBox').style.display = which === 0 ? '' : 'none';
  $('wgJsBox').style.display = which === 1 ? '' : 'none';
  $('wgTabPv').classList.toggle('on', which === 0);
  $('wgTabJs').classList.toggle('on', which === 1);
}
async function wtCopySpec(id){
  try{
    const w = await api('/api/widgets/' + id);
    await fetch('/api/widgets/' + id + '/copy', {method:'POST', headers:{'Authorization':'Bearer ' + API_TOKEN}, body:'{}'});
    const text = JSON.stringify(w.spec, null, 2);
    if(navigator.clipboard && navigator.clipboard.writeText){ await navigator.clipboard.writeText(text); }
    else{
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
    }
    wtToast('已复制 ' + w.name + ' 的 JSON');
  }catch(e){ wtToast(e.message); }
}
async function wtDup(id){
  try{
    const r = await api('/api/widgets/' + id + '/duplicate', {method:'POST', body:'{}'});
    wtToast('已另存为「' + r.item.name + '」');
    WT.tab = 'custom'; wtGo();
  }catch(e){ wtToast(e.message); }
}
async function wtDel(id){
  if(!confirm('确认删除该 Widget？')) return;
  try{ await api('/api/widgets/' + id, {method:'DELETE'}); wtToast('已删除'); wtLoad().then(wtRepaint); }
  catch(e){ wtToast(e.message); }
}

async function wtEdit(id){
  let w = {name:'', category:'简单信息', description:'', spec:{}};
  if(id){
    try{ w = await api('/api/widgets/' + id); }catch(e){ wtToast(e.message); return; }
  }
  openModal('<div class="row"><b>' + (id ? '编辑 Widget' : '新建 Widget') + '</b></div>' +
    '<div id="wtMsg" style="margin:8px 0"></div>' +
    '<div style="display:grid;grid-template-columns:1fr 150px;gap:10px;margin-top:6px">' +
    '<input id="wtName" placeholder="名称（必填）" value="' + esc(w.name) + '">' +
    '<select id="wtCat">' + WT_CATS.filter(c => c !== '全部').map(c => '<option' + (c === (w.category || '简单信息') ? ' selected' : '') + '>' + c + '</option>').join('') + '</select></div>' +
    '<input id="wtDesc" placeholder="描述（列表页展示）" style="margin-top:10px" value="' + esc(w.description || '') + '">' +
    '<div class="wg-tabs"><span class="ptpl-subtab on" id="weTabJs" onclick="weShowTab(1)">JSON</span>' +
    '<span class="ptpl-subtab" id="weTabPv" onclick="weShowTab(0)">预览</span></div>' +
    '<textarea id="wtSpec" class="ptpl-ta" style="min-height:200px" placeholder=\'{"type":"info","title":"标题",...}\'>' + esc(JSON.stringify(w.spec || {}, null, 2)) + '</textarea>' +
    '<div id="wePvBox" style="display:none"></div>' +
    '<div class="row" style="margin-top:12px;justify-content:flex-end">' +
    '<button class="ghost" onclick="closeModal()">取消</button>' +
    '<button class="sm" style="margin-left:8px" onclick="wtSave(' + (id || 0) + ')">保存</button></div>');
}
function weShowTab(which){
  const ok = (function(){
    try{ return JSON.parse($('wtSpec').value); }catch(e){ return null; }
  })();
  if(which === 0){
    if(!ok){ msg('wtMsg', 'err', 'JSON 不合法，无法预览'); return; }
    $('wePvBox').innerHTML = wgCardHTML(ok, 'wePv', true);
  }
  $('wtSpec').style.display = which === 1 ? '' : 'none';
  $('wePvBox').style.display = which === 0 ? '' : 'none';
  $('weTabJs').classList.toggle('on', which === 1);
  $('weTabPv').classList.toggle('on', which === 0);
}
async function wtSave(id){
  const name = ($('wtName').value || '').trim();
  if(!name){ msg('wtMsg', 'err', '名称不能为空'); return; }
  let spec;
  try{ spec = JSON.parse($('wtSpec').value); }
  catch(e){ msg('wtMsg', 'err', 'spec JSON 不合法'); return; }
  const body = {name: name, category: $('wtCat').value, description: ($('wtDesc').value || '').trim(),
                spec_json: JSON.stringify(spec)};
  try{
    if(id){ await api('/api/widgets/' + id, {method:'PUT', body:JSON.stringify(body)}); }
    else{ await api('/api/widgets', {method:'POST', body:JSON.stringify(body)}); WT.tab = 'custom'; }
    closeModal(); wtToast('已保存'); wtGo();
  }catch(e){ msg('wtMsg', 'err', e.message); }
}

</script>
